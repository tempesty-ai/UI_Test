name: QA Automation Pipeline

on:
  # 평일 09:00 KST (UTC 00:00) 자동 실행
  schedule:
    - cron: '0 0 * * 1-5'

  # 수동 실행 (Actions 탭에서 Run workflow 버튼)
  workflow_dispatch:
    inputs:
      target_url:
        description: '테스트 대상 URL (비워두면 targets.json 사용)'
        required: false
        default: ''

jobs:
  generate-report:
    name: QA 결과 리포트 생성
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 HTML 리포트 생성
        run: python scripts/generate_report.py

      - name: 📁 리포트 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_number }}
          path: '**/report.html'
          retention-days: 30

      - name: 💾 결과 자동 커밋
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'ci: QA 리포트 자동 생성 [skip ci]'
          file_pattern: '**/report.html'

      - name: 📣 Slack 알림 전송
        if: env.SLACK_QA_WEBHOOK != ''
        env:
          SLACK_QA_WEBHOOK: ${{ secrets.SLACK_QA_WEBHOOK }}
        run: |
          python -c "
          import os, re, glob, json, urllib.request
          files = glob.glob('*/SUMMARY.md')
          if not files: exit(0)
          latest = max(files, key=os.path.getmtime)
          content = open(latest, encoding='utf-8').read()
          pass_m = re.search('PASS.*?([0-9]+)개', content)
          fail_m = re.search('FAIL.*?([0-9]+)개', content)
          warn_m = re.search('WARNING.*?([0-9]+)개', content)
          url_m  = re.search('대상 URL.*?(https?://[^ ]+)', content)
          passes = pass_m.group(1) if pass_m else '?'
          fails  = fail_m.group(1) if fail_m else '?'
          warn   = warn_m.group(1) if warn_m else '?'
          url    = url_m.group(1).rstrip('*') if url_m else 'unknown'
          emoji  = ':white_check_mark:' if fails == '0' else ':red_circle:'
          text   = emoji + ' *[GitHub Actions] QA 완료* | ' + url + '\nPASS ' + passes + '  FAIL ' + fails + '  WARN ' + warn + '\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          payload = json.dumps({'text': text}).encode('utf-8')
          req = urllib.request.Request(os.environ['SLACK_QA_WEBHOOK'], data=payload, headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req, timeout=5)
          "
